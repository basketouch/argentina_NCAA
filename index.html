<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Jugadores Argentinos en USA — Dashboard</title>
<style>
  :root{
    --bg:#f4f6f9; --bg2:#ffffff; --card:#ffffff; --card2:#fbfcfe; --border:#dde3ea; --text:#1c2733; --muted:#6b7889;
    --accent:#2876e0; --accent2:#6a3df0;
    --t1:#1aa05a; --t1bg:#e3f7eb; --t1soft:#e3f7eb;
    --t2:#b8860b; --t2bg:#fdf0d0; --t2soft:#fdf0d0;
    --t3:#2876e0; --t3bg:#e3edfb; --t3soft:#e3edfb;
    --t4:#6b7889; --t4bg:#eaedf1; --t4soft:#eaedf1;
    --t5:#d63b3b; --t5bg:#fbe4e4; --t5soft:#fbe4e4;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(1200px 600px at 10% -10%, #eaf1fb 0%, var(--bg) 55%);color:var(--text);}
  header{padding:28px 32px 8px;}
  h1{margin:0 0 4px;font-size:23px;background:linear-gradient(90deg,#1c2733,#2876e0);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:10px;}
  .flag-icon{width:26px;height:26px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.25);}
  .sub{color:var(--muted);font-size:13px;}
  .sub-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .sync-status{display:none;}
  .refresh-btn{
    background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:4px 10px;border-radius:20px;font-size:11.5px;cursor:pointer;transition:border-color .15s, color .15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .refresh-btn:hover{border-color:var(--accent);color:var(--accent);}
  .sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#b9c2cc;transition:background .2s;}
  .sync-dot.syncing{background:#ffd23f;animation:pulse 1s infinite;}
  .sync-dot.ok{background:#1aa05a;}
  .sync-dot.error{background:#d63b3b;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .toprow{display:flex;gap:24px;align-items:flex-start;padding:0 32px 8px;flex-wrap:wrap;}
  .statcol{flex:1 1 320px;min-width:280px;}
  .col-title{margin:0 0 10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .col-title.panel-toggle{display:flex;align-items:center;gap:6px;}
  .stats{display:flex;gap:14px;flex-wrap:wrap;}
  .stat{background:linear-gradient(155deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:12px;padding:14px 20px;min-width:130px;flex:1 1 130px;box-shadow:0 2px 10px rgba(30,40,60,.06);}
  .stat .num{font-size:26px;font-weight:800;}
  .stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;padding:8px 32px 16px;align-items:center;}
  .controls input,.controls select{
    background:#fff;border:1px solid var(--border);color:var(--text);
    padding:8px 12px;border-radius:8px;font-size:13px;transition:border-color .15s;
  }
  .controls input:focus,.controls select:focus{outline:none;border-color:var(--accent);}
  .controls input{flex:1;min-width:180px;}
  .tierlegend{display:flex;gap:14px;flex-wrap:wrap;padding:0 32px 18px;font-size:11.5px;color:var(--muted);}
  .tierlegend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .panels{display:flex;gap:20px;padding:0 32px 16px;flex-wrap:wrap;}
  .panel{background:linear-gradient(155deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:12px;padding:16px;flex:1;min-width:280px;box-shadow:0 2px 10px rgba(30,40,60,.06);}
  .panel h3{margin:0 0 12px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .panel-toggle{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;transition:color .15s;}
  .panel-toggle:hover{color:var(--accent);}
  .chevron{display:inline-block;transition:transform .2s;font-size:10px;}
  .panel-body{overflow:hidden;max-height:1000px;transition:max-height .25s ease, opacity .2s ease;opacity:1;}
  .panel-body.collapsed{max-height:0;opacity:0;}
  .panel.is-collapsed .chevron{transform:rotate(-90deg);}
  .bar-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:12px;}
  .bar-label{width:140px;flex-shrink:0;color:var(--muted);text-align:right;}
  .bar-track{flex:1;background:#eef1f5;border-radius:5px;height:15px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border);}
  .bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s;}
  .bar-count{width:28px;color:var(--text);font-size:11.5px;font-weight:600;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.03em;padding:10px 10px;border-bottom:2px solid var(--border);
    position:sticky;top:0;background:#f7f9fb;cursor:pointer;transition:color .15s;
  }
  thead th:hover{color:var(--accent);}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  tbody td.muted{white-space:normal;font-size:11.5px;max-width:180px;}
  tbody tr{border-left:3px solid transparent;transition:background .15s;}
  tbody tr:hover{background:#f2f6fb;}
  .tablewrap{margin:0 32px 40px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:560px;box-shadow:0 2px 10px rgba(30,40,60,.06);}
  .tag{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-block;letter-spacing:.01em;}
  .name{font-weight:700;color:#0d1521;}
  .muted{color:var(--muted);font-size:12px;}
  a{color:var(--accent);text-decoration:none;font-weight:600;}
  a:hover{text-decoration:underline;}
  .count{padding:0 32px;color:var(--muted);font-size:12px;margin-bottom:6px;}

  /* ── Modal ── */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c2733;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.25);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);backdrop-filter:blur(3px);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s;}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(10,20,50,.18);transform:translateY(16px) scale(.97);transition:transform .22s cubic-bezier(.2,.8,.4,1), opacity .2s;opacity:0;overflow:hidden;}
  .modal-overlay.open .modal{transform:none;opacity:1;}
  .modal-header{padding:20px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px;}
  .modal-tier-bar{width:4px;border-radius:4px;align-self:stretch;flex-shrink:0;}
  .modal-name{font-size:20px;font-weight:800;color:var(--text);margin:0 0 6px;}
  .modal-tag{display:inline-block;}
  .modal-close{margin-left:auto;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;padding:0 2px;flex-shrink:0;}
  .modal-close:hover{color:var(--text);}
  .modal-body{padding:18px 22px 22px;display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;}
  .modal-field{display:flex;flex-direction:column;gap:2px;}
  .modal-field.full{grid-column:1/-1;}
  .modal-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .modal-value{font-size:13.5px;font-weight:600;color:var(--text);}
  .modal-value a{color:var(--accent);}
  .modal-value.notes{font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.5;}

  @media (max-width:720px){
    header{padding:18px 16px 6px;}
    h1{font-size:18px;}
    .sub{font-size:12px;}
    .toprow{padding:0 16px 8px;gap:18px;}
    .statcol{min-width:0;flex:1 1 100%;}
    .stats{gap:8px;}
    .stat{padding:10px 14px;min-width:0;flex:1 1 calc(50% - 8px);}
    .stat .num{font-size:20px;}
    .controls{padding:8px 16px 12px;}
    .controls input,.controls select{width:100%;flex:1 1 100%;min-width:0;}
    .tierlegend{padding:0 16px 14px;gap:8px 12px;font-size:10.5px;}
    .bar-label{width:90px;font-size:11px;}
    .tablewrap{margin:0 16px 28px;max-height:480px;}
    table{font-size:12px;}
    thead th,tbody td{padding:7px 8px;}
    .count{padding:0 16px;}
    /* keep table scrollable horizontally instead of squeezing columns unreadably */
    .tablewrap{overflow-x:auto;}
    thead th, tbody td{white-space:nowrap;}
    tbody td.muted, tbody td:last-child{white-space:normal;min-width:160px;}
  }
</style>
</head>

</div>

let DATA = FALLBACK_DATA;
let sortStack = []; // [{key, asc}, ...]

const DATA_URL = "/jugadores.json";

async function loadFromSheet(silent){
  const statusEl = document.getElementById("syncStatus");
  const dotEl = document.getElementById("syncDot");
  if(dotEl) dotEl.className = "sync-dot syncing";
  try{
    const res = await fetch(DATA_URL, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const newData = await res.json();
    if(!newData.length) throw new Error("Sin datos");
    DATA = newData;
    refreshSelectsAndRender();
    if(statusEl) statusEl.textContent = "Actualizado · " + new Date().toLocaleTimeString("es-AR");
    if(dotEl) dotEl.className = "sync-dot ok";
  }catch(e){
    console.warn("Usando datos locales.", e);
    if(statusEl) statusEl.textContent = "Datos locales";
    if(dotEl) dotEl.className = "sync-dot error";
  }
}

function fillSelect(id, key){
  const sel = document.getElementById(id);
  sel.innerHTML = sel.options[0].outerHTML;
  const vals = [...new Set(DATA.map(d=>d[key]).filter(Boolean))].sort();
  vals.forEach(v=>{
    const o = document.createElement("option");
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
}

function refreshSelectsAndRender(){
  fillSelect("filterTier","tier");
  fillSelect("filterGenero","genero");
  fillSelect("filterDivision","division");
  render();
}


fillSelect("filterTier","tier");
fillSelect("filterGenero","genero");
fillSelect("filterDivision","division");

function renderStats(rows){
  const total = rows.length;
  const t1 = rows.filter(r=>r.tier==="Confirmado 2026-27").length;
  const fem = rows.filter(r=>r.genero==="F").length;
  const masc = rows.filter(r=>r.genero==="M").length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">Total filtrado</div></div>
    <div class="stat"><div class="num" style="color:var(--t1)">${t1}</div><div class="lbl">Confirmados 2026-27</div></div>
    <div class="stat"><div class="num">${masc}</div><div class="lbl">Masculino</div></div>
    <div class="stat"><div class="num">${fem}</div><div class="lbl">Femenino</div></div>
  `;
}

function renderBarChart(targetId, rows, key, colorVar="var(--accent)"){
  const counts = {};
  rows.forEach(r=>{ counts[r[key]] = (counts[r[key]]||0)+1; });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(...entries.map(e=>e[1]), 1);
  document.getElementById(targetId).innerHTML = entries.map(([label,count])=>{
    const pct = (count/max*100).toFixed(0);
    const meta = TIER_META[label];
    const color = meta ? meta.c : colorVar;
    return `<div class="bar-row">
      <div class="bar-label" title="${label}">${label.length>22?label.slice(0,20)+'…':label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="bar-count">${count}</div>
    </div>`;
  }).join("");
}

function renderDivisionCards(targetId, rows, key){
  const counts = {};
  rows.forEach(r=>{ counts[r[key]] = (counts[r[key]]||0)+1; });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  document.getElementById(targetId).innerHTML = entries.map(([label,count])=>`
    <div class="stat">
      <div class="num">${count}</div>
      <div class="lbl">${label}</div>
    </div>
  `).join("");
}

function render(){
  const q = document.getElementById("search").value.toLowerCase();
  const ft = document.getElementById("filterTier").value;
  const fg = document.getElementById("filterGenero").value;
  const fd = document.getElementById("filterDivision").value;

  let rows = DATA.filter(d=>{
    if(ft && d.tier!==ft) return false;
    if(fg && d.genero!==fg) return false;
    if(fd && d.division!==fd) return false;
    if(q){
      const hay = `${d.nombre} ${d.institucion} ${d.origen} ${d.club_arg} ${d.posicion}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(sortStack.length){
    rows.sort((a,b)=>{
      for(const {key,asc} of sortStack){
        const va=(a[key]||"").toString(), vb=(b[key]||"").toString();
        const cmp = va.localeCompare(vb,"es",{sensitivity:"base"});
        if(cmp!==0) return asc ? cmp : -cmp;
      }
      return 0;
    });
  }

  document.getElementById("count").innerHTML = `${rows.length} jugador(es) encontrados &nbsp;·&nbsp; <span style="color:var(--accent);font-style:italic">Haz clic en cualquier fila para ver el perfil completo</span>`;
  renderStats(rows);
  renderDivisionCards("chartDivision", rows, "division");

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = rows.map((d,i)=>{
    const meta = TIER_META[d.tier] || {c:"var(--muted)",bg:"#eaedf1"};
    return `<tr style="border-left-color:${meta.c};cursor:pointer" data-idx="${i}" title="Ver detalle">
      <td class="name">${d.nombre}</td>
      <td>${d.genero}</td>
      <td><span class="tag" style="color:${meta.c};background:${meta.bg}">${d.tier}</span></td>
      <td>${d.nacimiento||"—"}</td>
      <td>${d.anio}</td>
      <td>${d.posicion}</td>
      <td>${d.institucion}</td>
      <td>${d.division}</td>
      <td>${d.fecha}</td>
      <td>${d.fuente ? `<a href="${d.fuente.split(' ; ')[0]}" target="_blank" onclick="event.stopPropagation()">link</a>` : ''}</td>
      <td class="muted" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic">${d.notas ? d.notas.slice(0,80) + (d.notas.length>80?'…':'') : '—'}</td>
    </tr>`;
  }).join("");
  _currentRows = rows;
  tbody.querySelectorAll("tr").forEach(tr=>{
    tr.addEventListener("click", ()=> openModal(_currentRows[+tr.dataset.idx]));
  });
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("filterTier").addEventListener("change", render);
document.getElementById("filterGenero").addEventListener("change", render);
document.getElementById("filterDivision").addEventListener("change", render);
document.querySelectorAll(".panel-toggle").forEach(h=>{
  h.addEventListener("click", ()=>{
    const body = document.getElementById(h.dataset.target);
    body.classList.toggle("collapsed");
    h.closest(".panel").classList.toggle("is-collapsed");
  });
});
document.querySelectorAll("thead th[data-k]").forEach(th=>{
  th.dataset.label = th.textContent.trim(); // guarda el texto original una sola vez
});

function updateSortIndicators(){
  document.querySelectorAll("thead th[data-k]").forEach(t=>{
    const idx = sortStack.findIndex(s=>s.key===t.dataset.k);
    const arrow = idx>=0 ? (sortStack[idx].asc ? " ↑" : " ↓") : "";
    const num = sortStack.length>1 && idx>=0 ? `<sup style="color:var(--accent)">${idx+1}</sup>` : "";
    t.innerHTML = t.dataset.label + arrow + num;
  });
}

document.querySelectorAll("thead th[data-k]").forEach(th=>{
  th.addEventListener("click", e=>{
    const k = th.dataset.k;
    const existing = sortStack.findIndex(s=>s.key===k);
    if(e.shiftKey){
      if(existing>=0) sortStack[existing].asc = !sortStack[existing].asc;
      else sortStack.push({key:k,asc:true});
    } else {
      if(existing===0) sortStack[0].asc = !sortStack[0].asc;
      else sortStack = [{key:k,asc:true}];
    }
    updateSortIndicators();
    render();
  });
});

let _currentRows = [];

function openModal(d){
  const meta = TIER_META[d.tier] || {c:"var(--muted)",bg:"#eaedf1"};
  document.getElementById("modalTierBar").style.background = meta.c;
  document.getElementById("modalName").textContent = d.nombre;
  const tag = document.getElementById("modalTag");
  tag.textContent = d.tier;
  tag.style.color = meta.c;
  tag.style.background = meta.bg;

  const fields = [
    ["Universidad", d.institucion],
    ["División", d.division || "—"],
    ["Género", d.genero === "M" ? "Masculino" : "Femenino"],
    ["Nacimiento", d.nacimiento || "—"],
    ["Año / Categoría", d.anio || "—"],
    ["Posición", d.posicion || "—"],
    ["Origen", d.origen || "—"],
    ["Club formación", d.club_arg || "—"],
    ["Estado", d.estado || "—"],
    ["Fecha confirmación", d.fecha || "—"],
  ];

  let html = fields.map(([lbl, val])=>`
    <div class="modal-field">
      <span class="modal-label">${lbl}</span>
      <span class="modal-value">${val}</span>
    </div>`).join("");

  if(d.notas) html += `
    <div class="modal-field full">
      <span class="modal-label">Notas</span>
      <span class="modal-value notes">${d.notas}</span>
    </div>`;

  if(d.fuente) html += `
    <div class="modal-field full">
      <span class="modal-label">Fuente</span>
      <span class="modal-value"><a href="${d.fuente.split(' ; ')[0]}" target="_blank">${d.fuente.split(' ; ')[0]}</a></span>
    </div>`;

  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal(){
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalOverlay").addEventListener("click", e=>{
  if(e.target === document.getElementById("modalOverlay")) closeModal();
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

render();
loadFromSheet();

document.getElementById("exportPdf").addEventListener("click", async () => {
  const btn = document.getElementById("exportPdf");
  const toast = document.getElementById("toast");
  const showToast = msg => { toast.textContent = msg; toast.classList.add("show"); };
  const hideToast = () => toast.classList.remove("show");
  btn.disabled = true;
  showToast("⏳ Generando PDF…");

  // Load jsPDF first, then autoTable (must be sequential)
  const loadScript = src => new Promise(r => { const s = document.createElement("script"); s.src = src; s.onload = r; document.head.appendChild(s); });
  if (!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  if (!window.jspdf?.jsPDF?.prototype?.autoTable) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js");

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });

  const cols = ["Nombre","Género","Nivel","Nacimiento","Año/Cat.","Posición","Universidad","División","Fecha","Notas"];
  const pdfStr = s => (s || "N/D").replace(/→/g, ">").replace(/[^\x00-\xFF]/g, "?");
  const rows = _currentRows.map(d => [
    pdfStr(d.nombre), d.genero === "M" ? "Masc." : "Fem.", d.tier,
    pdfStr(d.nacimiento), pdfStr(d.anio), pdfStr(d.posicion),
    pdfStr(d.institucion), pdfStr(d.division), pdfStr(d.fecha),
    pdfStr((d.notas || "").slice(0, 120))
  ]);

  const tierColors = {
    "Confirmado 2026-27": [227, 247, 235],
    "Prospecto":          [253, 240, 208],
    "En seguimiento":     [227, 237, 251],
  };

  doc.setFontSize(13);
  doc.setTextColor(28, 39, 51);
  const ahora = new Date();
  const fechaExport = ahora.toLocaleDateString("es-AR", {day:"2-digit",month:"2-digit",year:"numeric"});
  const horaExport = ahora.toLocaleTimeString("es-AR", {hour:"2-digit",minute:"2-digit"});
  doc.text("Jugadores Argentinos en USA", 14, 14);
  doc.setFontSize(9);
  doc.setTextColor(107, 120, 137);
  doc.text(`${_currentRows.length} jugador(es) · Exportado el ${fechaExport} a las ${horaExport}`, 14, 20);

  doc.autoTable({
    startY: 25,
    head: [cols],
    body: rows,
    styles: { fontSize: 7.5, cellPadding: 2.5, overflow: "linebreak" },
    headStyles: { fillColor: [28, 39, 51], textColor: 255, fontStyle: "bold", fontSize: 8 },
    columnStyles: {
      0: { fontStyle: "bold", cellWidth: 28 },
      2: { cellWidth: 30 },
      6: { cellWidth: 36 },
      9: { cellWidth: 50 },
    },
    didParseCell: (data) => {
      if (data.section === "body" && data.column.index === 2) {
        const tier = data.cell.raw;
        const bg = tierColors[tier];
        if (bg) data.cell.styles.fillColor = bg;
      }
    },
    alternateRowStyles: { fillColor: [248, 250, 252] },
    margin: { left: 14, right: 14 },
  });

  // Filtros activos en footer
  const filtros = [
    document.getElementById("filterTier").value,
    document.getElementById("filterGenero").value,
    document.getElementById("filterDivision").value,
    document.getElementById("search").value,
  ].filter(Boolean).join(" · ");
  const legend = [
    { label: "Confirmado 2026-27", color: [26,160,90],   desc: "Plaza confirmada en equipo universitario USA 2026-27" },
    { label: "En seguimiento",     color: [40,118,224],  desc: "Activo hasta 2025-26; situacion 2026-27 pendiente de verificar" },
    { label: "Prospecto",          color: [184,134,11],  desc: "Sin compromiso aun; en prep school, cantera o exposicion NCAA" },
  ];
  let ly = doc.lastAutoTable.finalY + 8;
  doc.setFontSize(7.5);
  legend.forEach(({label, color, desc}) => {
    doc.setFillColor(...color);
    doc.roundedRect(14, ly, 3, 3, 0.5, 0.5, "F");
    doc.setFont(undefined,"bold"); doc.setTextColor(28,39,51);
    doc.text(label + ":", 19, ly+2.8);
    doc.setFont(undefined,"normal"); doc.setTextColor(107,120,137);
    doc.text(desc, 19 + doc.getTextWidth(label + ": "), ly+2.8);
    ly += 6;
  });
  if (filtros) {
    ly += 2;
    doc.setFontSize(7); doc.setTextColor(150);
    doc.text("Filtros: " + filtros, 14, ly);
  }

  const partesFiltro = [
    document.getElementById("filterTier").value,
    document.getElementById("filterGenero").value,
    document.getElementById("filterDivision").value,
    document.getElementById("search").value.trim().slice(0,20),
  ].filter(Boolean).map(s => s.replace(/\s+/g,"-").replace(/[^a-zA-Z0-9\-áéíóúÁÉÍÓÚüÜñÑ]/g,""));
  const filtroStr = partesFiltro.length ? partesFiltro.join("-") : "todos";
  doc.save(`arg-ncaa-${filtroStr}-${new Date().toISOString().slice(0,10)}.pdf`);
  showToast("✅ PDF descargado");
  setTimeout(hideToast, 2500);
  btn.disabled = false;
});
</script>
